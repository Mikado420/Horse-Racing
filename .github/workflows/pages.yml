# main に Push されるたびにオフライン版（ひとりで遊ぶ）をビルドして GitHub Pages に公開する
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 依存パッケージを取得
        run: npm install --no-audit --no-fund
      - name: テスト（共通ロジックとオフライン版）
        run: npm run test:offline
      - name: 型チェック（結果は記録のみ）
        run: npm run typecheck -w client
        continue-on-error: true
      - name: オフライン版をビルド
        run: npx vite build
        working-directory: client
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_OFFLINE_ONLY: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
